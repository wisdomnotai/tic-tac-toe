<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Impossible Tic Tac Toe</title>
</head>

<body>

    <main id="startScreen">

        <h1>Tic Tac Toe</h1>

        <p class="subtitle">
            Can you beat the impossible bot?
        </p>

        <div id="nameForm">

            <input
                id="playerNameInput"
                type="text"
                placeholder="Enter your name"
                autocomplete="off"
            >

            <button id="startGame">
                Start Game
            </button>

        </div>

    </main>


    <main id="gameScreen" hidden>

        <div class="gameTopBar">

            <span id="gameNumber">
                Game 1 of 5
            </span>

            <button id="restart">
                Restart
            </button>

        </div>


        <div id="scoreBoard">

            <div class="playerScore">

                <h2 id="playerName">
                    Player
                </h2>

                <span class="symbol">
                    X
                </span>

                <p id="playerScore">
                    0
                </p>

            </div>


            <div class="versus">
                VS
            </div>


            <div class="playerScore">

                <h2>
                    Impossible Bot
                </h2>

                <span class="symbol">
                    O
                </span>

                <p id="botScore">
                    0
                </p>

            </div>

        </div>


        <p id="status">
            Your turn
        </p>


        <div id="boardGrid"></div>

    </main>


    <main id="roundScreen" hidden>

        <div class="resultCard">

            <p class="resultLabel">
                ROUND COMPLETE
            </p>

            <h1 id="roundResult"></h1>

            <div id="finalScore"></div>

            <p id="roundMessage"></p>

            <button id="rematch">
                Play Again
            </button>

            <button id="newPlayer">
                New Player
            </button>

        </div>

    </main>


    <script
        type="module"
        src="./index.js"
    ></script>

</body>

</html>
