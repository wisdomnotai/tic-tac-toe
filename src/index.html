<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
</head>

<body>

    <!-- start screen -->
    <main id="startScreen">

        <h1>Tic Tac Toe</h1>

        <div id="modeSelection">
            <button id="botMode">Play vs Bot</button>
            <button id="multiplayerMode">Multiplayer</button>
        </div>

        <div id="nameForm"></div>

    </main>

    <!-- game screen -->
    <main id="gameScreen" hidden>

        <div id="scoreBoard">

            <div class="playerScore">
                <h2 id="playerOneName">Player 1</h2>
                <p id="playerOneScore">0</p>
            </div>

            <div class="playerScore">
                <h2 id="playerTwoName">Player 2</h2>
                <p id="playerTwoScore">0</p>
            </div>

        </div>

        <h1>Tic Tac Toe</h1>

        <p id="status">Player X's turn</p>

        <div id="boardGrid"></div>

        <button id="restart">Restart Game</button>

    </main>

    <!-- round result -->
    <main id="roundScreen" hidden>

        <h1 id="roundResult"></h1>

        <button id="newRound">New Round</button>

    </main>

    <script type="module" src="./index.js"></script>

</body>
</html>
